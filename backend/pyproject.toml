[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "LOG", "UP"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` in argument defaults is the canonical DI pattern
]

[tool.ruff.lint.per-file-ignores]
# Exception handlers receive `exc` as a parameter rather than via an `except` block,
# so `exc_info=True` is intentional here even though ruff can't see the active exception statically.
"app/exceptions.py" = ["LOG014"]
