# docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Set to a real path only if ./cookies/youtube_cookies.txt exists (see
      # README) - YouTube blocks anonymous requests from VPS/datacenter IPs
      # ("Sign in to confirm you're not a bot") without this. Safe to leave
      # unset; download.py only uses it if the file actually exists.
      YT_COOKIES_FILE: /app/cookies/youtube_cookies.txt
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Rendered trailer/summary outputs and downloaded source video live
      # here so they survive container restarts/rebuilds.
      - media_data:/app/media
      # Drop a Netscape-format cookies.txt at ./cookies/youtube_cookies.txt
      # (host side) to work around YouTube's anti-bot blocking. Optional.
      - ./cookies:/app/cookies:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
